<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Câmera - Ponto Fácil</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: white;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        h1 { color: #333; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
        h1 i { color: #667eea; }
        .subtitle { color: #666; margin-bottom: 30px; padding-bottom: 15px; border-bottom: 1px solid #e5e5e5; }
        .video-container { background: #1a1a2e; border-radius: 16px; overflow: hidden; margin-bottom: 20px; }
        video { width: 100%; display: block; background: #1a1a2e; }
        .controls { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4); }
        button.secondary { background: #6b7280; }
        button.danger { background: #ef4444; }
        button.success { background: #10b981; }
        .status-card { background: #f8f9fa; border-radius: 12px; padding: 15px; margin-top: 20px; border-left: 4px solid #667eea; }
        .status-title { font-weight: 600; margin-bottom: 10px; color: #333; }
        .status-message { font-family: monospace; font-size: 13px; color: #666; word-break: break-all; }
        .info-list { margin-top: 15px; padding: 10px; background: #e0e7ff; border-radius: 8px; font-size: 13px; }
        .info-list p { margin: 5px 0; }
        .success { color: #10b981; }
        .error { color: #ef4444; }
        .warning { color: #f59e0b; }
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #667eea;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 600px) { .container { padding: 20px; } button { padding: 8px 16px; font-size: 12px; } }
    </style>
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-camera"></i> Teste de Câmera</h1>
        <div class="subtitle">Verifique se sua webcam está funcionando corretamente para o reconhecimento facial</div>
        
        <div class="video-container">
            <video id="video" autoplay muted playsinline></video>
        </div>
        
        <div class="controls">
            <button id="btnIniciar" class="success"><i class="fas fa-play"></i> Iniciar Câmera</button>
            <button id="btnParar" class="danger"><i class="fas fa-stop"></i> Parar Câmera</button>
            <button id="btnCapturar" class="secondary"><i class="fas fa-camera"></i> Tirar Foto</button>
            <button id="btnTestarFace" class="primary"><i class="fas fa-face-smile"></i> Testar Face API</button>
        </div>
        
        <div class="status-card">
            <div class="status-title"><i class="fas fa-info-circle"></i> Status</div>
            <div class="status-message" id="statusMessage">Clique em "Iniciar Câmera" para começar</div>
        </div>
        
        <div class="info-list" id="infoList">
            <p><strong>📋 Informações:</strong></p>
            <p id="cameraInfo">• Navegador: Carregando...</p>
            <p id="deviceInfo">• Dispositivos: Aguardando...</p>
            <p id="modelInfo">• Modelos: Aguardando download...</p>
        </div>
        
        <canvas id="canvas" style="display: none;"></canvas>
    </div>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    
    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let stream = null;
        let modelsLoaded = false;
        
        const statusMessage = document.getElementById('statusMessage');
        const cameraInfo = document.getElementById('cameraInfo');
        const deviceInfo = document.getElementById('deviceInfo');
        const modelInfo = document.getElementById('modelInfo');
        
        function updateStatus(message, type = 'info') {
            statusMessage.innerHTML = message;
            statusMessage.className = 'status-message';
            if (type === 'success') statusMessage.classList.add('success');
            else if (type === 'error') statusMessage.classList.add('error');
            else if (type === 'warning') statusMessage.classList.add('warning');
        }
        
        function detectBrowser() {
            const ua = navigator.userAgent;
            if (ua.indexOf('Chrome') > -1) return 'Chrome';
            if (ua.indexOf('Firefox') > -1) return 'Firefox';
            if (ua.indexOf('Safari') > -1) return 'Safari';
            if (ua.indexOf('Edge') > -1) return 'Edge';
            return 'Desconhecido';
        }
        
        cameraInfo.innerHTML = `• Navegador: ${detectBrowser()}`;
        
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            updateStatus('❌ Seu navegador não suporta acesso à câmera.', 'error');
            document.getElementById('btnIniciar').disabled = true;
        }
        
        async function listDevices() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(device => device.kind === 'videoinput');
                deviceInfo.innerHTML = `• Dispositivos de vídeo encontrados: ${videoDevices.length}`;
                if (videoDevices.length === 0) {
                    deviceInfo.innerHTML += '<br>⚠️ Nenhuma câmera encontrada! Verifique se sua webcam está conectada.';
                    updateStatus('⚠️ Nenhuma câmera detectada no seu computador.', 'warning');
                } else {
                    videoDevices.forEach((device, i) => {
                        deviceInfo.innerHTML += `<br>  - ${device.label || `Câmera ${i + 1}`}`;
                    });
                }
            } catch (err) {
                deviceInfo.innerHTML = `• Erro ao listar dispositivos: ${err.message}`;
            }
        }
        listDevices();
        
        // CARREGAR MODELOS LOCALMENTE
        async function loadFaceModels() {
 const MODEL_URL = '/assets/models';
            modelInfo.innerHTML = '• Modelos: 📥 Baixando arquivos...';
            updateStatus('<span class="loading"></span> Carregando modelos de reconhecimento facial...', 'info');
            
            try {
                // Verificar se os arquivos existem localmente
                const checkResponse = await fetch(MODEL_URL + '/tiny_face_detector_model-weights_manifest.json');
                if (!checkResponse.ok) {
                    throw new Error('Arquivos dos modelos não encontrados na pasta assets/models. Baixe os arquivos do repositório do face-api.js');
                }
                
                await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
                await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
                await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
                
                modelsLoaded = true;
                modelInfo.innerHTML = '• Modelos: ✅ Carregados com sucesso!';
                updateStatus('✅ Modelos carregados! Posicione o rosto no centro da tela e clique em "Testar Face API".', 'success');
                return true;
            } catch (err) {
                console.error('Erro ao carregar modelos:', err);
                modelInfo.innerHTML = `• Modelos: ❌ Erro - ${err.message}`;
                updateStatus(`❌ Erro ao carregar modelos: ${err.message}. Verifique se a pasta assets/models contém os 6 arquivos necessários.`, 'error');
                return false;
            }
        }
        
        async function startCamera() {
            updateStatus('<span class="loading"></span> Solicitando permissão...', 'info');
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' }
                });
                video.srcObject = stream;
                await new Promise((resolve) => { video.onloadedmetadata = () => { video.play(); resolve(); }; });
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                updateStatus('✅ Câmera funcionando! Agora carregue os modelos clicando em "Testar Face API".', 'success');
            } catch (err) {
                let errorMsg = '';
                if (err.name === 'NotAllowedError') errorMsg = '❌ Permissão negada! Clique no cadeado/ícone de câmera na barra de endereço e permita o acesso.';
                else if (err.name === 'NotFoundError') errorMsg = '❌ Nenhuma câmera encontrada! Verifique se sua webcam está conectada.';
                else if (err.name === 'NotReadableError') errorMsg = '❌ A câmera está sendo usada por outro programa. Feche outros aplicativos.';
                else errorMsg = `❌ Erro: ${err.message}`;
                updateStatus(errorMsg, 'error');
                console.error(err);
            }
        }
        
        function stopCamera() {
            if (stream) { stream.getTracks().forEach(track => track.stop()); video.srcObject = null; stream = null; updateStatus('⏹️ Câmera parada.', 'info'); }
            else updateStatus('⚠️ Nenhuma câmera ativa.', 'warning');
        }
        
        function capturarFoto() {
            if (!stream) { updateStatus('⚠️ Inicie a câmera primeiro!', 'warning'); return; }
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const link = document.createElement('a');
            link.download = 'captura_' + Date.now() + '.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
            updateStatus('✅ Foto capturada e salva!', 'success');
        }
        
        async function testarFaceDetection() {
            if (!stream) { updateStatus('⚠️ Inicie a câmera primeiro!', 'warning'); return; }
            if (!modelsLoaded) { await loadFaceModels(); if (!modelsLoaded) return; }
            
            updateStatus('<span class="loading"></span> Analisando rosto...', 'info');
            
            try {
                const detection = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
                    .withFaceLandmarks()
                    .withFaceDescriptor();
                
                if (detection) {
                    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    const box = detection.detection.box;
                    ctx.strokeStyle = '#10b981';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(box.x, box.y, box.width, box.height);
                    faceapi.draw.drawFaceLandmarks(canvas, detection);
                    
                    updateStatus(`✅ Rosto detectado! Confiança: ${(detection.detection.score * 100).toFixed(1)}%`, 'success');
                    
                    canvas.style.display = 'block';
                    canvas.style.position = 'fixed';
                    canvas.style.top = '50%';
                    canvas.style.left = '50%';
                    canvas.style.transform = 'translate(-50%, -50%)';
                    canvas.style.zIndex = '9999';
                    canvas.style.border = '3px solid #10b981';
                    canvas.style.borderRadius = '16px';
                    canvas.style.boxShadow = '0 4px 20px rgba(0,0,0,0.3)';
                    canvas.style.maxWidth = '90%';
                    canvas.style.maxHeight = '90%';
                    
                    setTimeout(() => { canvas.style.display = 'none'; }, 3000);
                } else {
                    updateStatus('⚠️ Nenhum rosto detectado. Posicione seu rosto no centro da tela.', 'warning');
                }
            } catch (err) {
                updateStatus(`❌ Erro na detecção: ${err.message}`, 'error');
            }
        }
        
        document.getElementById('btnIniciar').addEventListener('click', startCamera);
        document.getElementById('btnParar').addEventListener('click', stopCamera);
        document.getElementById('btnCapturar').addEventListener('click', capturarFoto);
        document.getElementById('btnTestarFace').addEventListener('click', testarFaceDetection);
        
        setTimeout(() => { startCamera(); }, 500);
        
        if (navigator.mediaDevices && navigator.mediaDevices.enumerateDevices) {
            navigator.mediaDevices.addEventListener('devicechange', () => { listDevices(); });
        }
        
        // Pré-carregar modelos
        loadFaceModels();
    </script>
</body>
</html>
