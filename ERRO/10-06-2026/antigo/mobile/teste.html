<body>
    <div class="container">
        <div class="card">
            <h3>📱 Teste da API Mobile</h3>
            <div class="url-base">
                🔗 API Base: <strong>http://localhost/ponto_empresarial/api/</strong>
            </div>
        </div>
        
        <div id="tokenStatus" class="card" style="display: none;">
            <div class="token-info">
                <strong>✅ Token Ativo</strong>
                <p id="tokenValue" style="font-family: monospace; font-size: 11px; margin-top: 8px;"></p>
                <button onclick="limparToken()" class="secondary" style="background: #ef4444; margin-top: 8px;">🗑️ Limpar Token</button>
            </div>
        </div>
        
        <!-- Login -->
        <div class="card" id="loginCard">
            <h3>🔐 Login</h3>
            <div class="form-group">
                <label>E-mail</label>
                <input type="email" id="email" value="joao@pontofacil.com">
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="senha" value="123456">
            </div>
            <button onclick="fazerLogin()">Entrar</button>
        </div>
        
        <!-- Registrar Ponto -->
        <div class="card" id="pontoCard" style="display: none;">
            <h3>⏰ Registrar Ponto</h3>
            <div class="form-group">
                <label>Tipo</label>
                <select id="tipoPonto">
                    <option value="entrada">Entrada</option>
                    <option value="saida_almoco">Saída Almoço</option>
                    <option value="volta_almoco">Volta Almoço</option>
                    <option value="saida">Saída</option>
                </select>
            </div>
            <div class="form-group">
                <label>Latitude (opcional)</label>
                <input type="text" id="latitude" placeholder="-23.550520">
            </div>
            <div class="form-group">
                <label>Longitude (opcional)</label>
                <input type="text" id="longitude" placeholder="-46.633308">
            </div>
            <button onclick="registrarPonto()">Registrar Ponto</button>
        </div>
        
        <!-- Extrato -->
        <div class="card" id="extratoCard" style="display: none;">
            <h3>📊 Consultar Extrato</h3>
            <div class="form-group">
                <label>Mês (YYYY-MM)</label>
                <input type="month" id="mesExtrato" value="<?php echo date('Y-m'); ?>">
            </div>
            <button onclick="consultarExtrato()">Buscar Extrato</button>
        </div>
        
        <!-- Resultado -->
        <div class="card" id="resultCard" style="display: none;">
            <h3>📤 Resultado <span id="resultStatus"></span></h3>
            <div id="result" class="result"></div>
        </div>
    </div>
    
    <script>
        let token = localStorage.getItem('api_token');
        const baseUrl = '/ponto_empresarial/api/';
        
        function atualizarUI() {
            if (token) {
                document.getElementById('tokenStatus').style.display = 'block';
                document.getElementById('tokenValue').textContent = token;
                document.getElementById('loginCard').style.display = 'none';
                document.getElementById('pontoCard').style.display = 'block';
                document.getElementById('extratoCard').style.display = 'block';
            } else {
                document.getElementById('tokenStatus').style.display = 'none';
                document.getElementById('loginCard').style.display = 'block';
                document.getElementById('pontoCard').style.display = 'none';
                document.getElementById('extratoCard').style.display = 'none';
            }
        }
        
        function mostrarResultado(data, success) {
            document.getElementById('resultCard').style.display = 'block';
            document.getElementById('resultStatus').innerHTML = `<span class="status ${success ? 'success' : 'error'}">${success ? 'SUCESSO' : 'ERRO'}</span>`;
            document.getElementById('result').textContent = JSON.stringify(data, null, 2);
        }
        
        async function fazerLogin() {
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            
            try {
                const response = await fetch(baseUrl + 'auth.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, senha: senha })
                });
                
                const text = await response.text();
                
                // Tentar parsear como JSON
                try {
                    const data = JSON.parse(text);
                    
                    if (data.success) {
                        token = data.token;
                        localStorage.setItem('api_token', token);
                        mostrarResultado(data, true);
                        atualizarUI();
                    } else {
                        mostrarResultado(data, false);
                    }
                } catch (e) {
                    mostrarResultado({ error: 'Resposta não é JSON', raw: text.substring(0, 500) }, false);
                }
            } catch (error) {
                mostrarResultado({ error: error.message }, false);
            }
        }
        
        async function registrarPonto() {
            if (!token) {
                mostrarResultado({ error: 'Faça login primeiro' }, false);
                return;
            }
            
            const tipo = document.getElementById('tipoPonto').value;
            const latitude = document.getElementById('latitude').value;
            const longitude = document.getElementById('longitude').value;
            
            const body = { tipo: tipo };
            if (latitude) body.latitude = parseFloat(latitude);
            if (longitude) body.longitude = parseFloat(longitude);
            
            try {
                const response = await fetch(baseUrl + 'ponto.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(body)
                });
                
                const text = await response.text();
                
                try {
                    const data = JSON.parse(text);
                    mostrarResultado(data, response.ok);
                } catch (e) {
                    mostrarResultado({ error: 'Resposta não é JSON', raw: text.substring(0, 500) }, false);
                }
            } catch (error) {
                mostrarResultado({ error: error.message }, false);
            }
        }
        
        async function consultarExtrato() {
            if (!token) {
                mostrarResultado({ error: 'Faça login primeiro' }, false);
                return;
            }
            
            const mes = document.getElementById('mesExtrato').value;
            
            try {
                const response = await fetch(baseUrl + `extrato.php?mes=${mes}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                const text = await response.text();
                
                try {
                    const data = JSON.parse(text);
                    mostrarResultado(data, response.ok);
                } catch (e) {
                    mostrarResultado({ error: 'Resposta não é JSON', raw: text.substring(0, 500) }, false);
                }
            } catch (error) {
                mostrarResultado({ error: error.message }, false);
            }
        }
        
        function limparToken() {
            localStorage.removeItem('api_token');
            token = null;
            atualizarUI();
            mostrarResultado({ message: 'Token removido com sucesso' }, true);
        }
        
        atualizarUI();
    </script>
